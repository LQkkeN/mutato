name: Release

# A signed tag pushed by the maintainer; the job only builds and publishes.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # trusted publishing: no RubyGems key is stored anywhere
    env:
      # Not the system gems, where the attestation's signer would load our json 3 and fail.
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@341b6d4d1c7bdbe628940ab4e27cbdc9c97950cc # v1.340.0
        with:
          ruby-version: ruby
      - run: bundle install # no cache: one written by another run must not reach a release
      - name: The tag, the gem and the changelog name the same version
        run: |
          version=${GITHUB_REF_NAME#v}
          gem=$(ruby -Ilib -rmutato/version -e 'print Mutato::VERSION')
          [ "$gem" = "$version" ] || {
            echo "The tag says $version, but lib/mutato/version.rb says $gem."
            exit 1
          }
          grep -qF "## [$version] - " CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [$version] - YYYY-MM-DD' heading."
            exit 1
          }
      - uses: rubygems/release-gem@2654a0fe0dc39725c07fe84d7fe863a084f2424e # v1.5.0
      - name: A GitHub release with the version's changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v version="$version" -f .github/release-notes.awk CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "mutato $version" \
            --notes-file "$RUNNER_TEMP/notes.md"
